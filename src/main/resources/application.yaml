spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USER:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
  connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
  read-timeout: ${PROVIDER_READ_TIMEOUT:5s}

activation:
  worker:
    enabled: ${ACTIVATION_WORKER_ENABLED:true}
    batch-size: 20
    poll-interval: PT2S
    reconcile-interval: PT1M
    max-attempts: 5
    base-delay: 5s
    max-delay: 5m
    stuck-after: 2m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
