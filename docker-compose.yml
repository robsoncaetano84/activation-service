services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./docker/oauth2:/config
    ports:
      - "9000:8080"

  provider-mock:
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./docker/wiremock:/home/wiremock
    ports:
      - "8089:8080"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      PROVIDER_BASE_URL: http://provider-mock:8080
      # O token é pedido de fora (localhost:9000), então é esse o emissor gravado nele.
      # As chaves a aplicação busca por dentro da rede do Compose.
      JWT_ISSUER_URI: http://localhost:9000/default
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://oauth2:8080/default/jwks
    ports:
      - "8080:8080"
    stop_grace_period: 40s
